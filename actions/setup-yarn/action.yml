name: 🧶 Set up Yarn
description: Set up Node.js, activate the repository Yarn version, and restore its package cache.

inputs:
  node-version:
    description: Node.js version to install.
    default: "22"

runs:
  using: composite
  steps:
    - name: 🟢 Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: 🧶 Enable Corepack
      shell: bash
      run: corepack enable

    - id: yarn
      name: 🔎 Resolve Yarn cache
      shell: bash
      run: |
        printf 'directory=%s\n' "$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
        printf 'version=%s\n' "$(yarn --version)" >> "$GITHUB_OUTPUT"

    - name: ♻️ Restore Yarn cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ runner.os }}-yarn-${{ steps.yarn.outputs.version }}-${{ hashFiles('yarn.lock') }}
        path: ${{ steps.yarn.outputs.directory }}
        restore-keys: |
          ${{ runner.os }}-yarn-${{ steps.yarn.outputs.version }}-
