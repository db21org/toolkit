name: 📦 Build and publish image
description: Publish an immutable GHCR image with provenance, SBOM, and configurable Docker caching.
inputs:
  context:
    description: Docker build context.
    default: .
  file:
    description: Dockerfile path; empty uses the context default.
    default: ""
  tags:
    description: Newline-separated image tags.
    required: true
  platforms:
    description: Comma-separated target platforms.
    default: linux/amd64
  qemu:
    description: Enable QEMU for cross-platform builds.
    default: "false"
  build-args:
    description: Newline-separated non-secret build arguments.
    default: ""
  cache-from:
    description: Docker cache import configuration.
    default: ""
  cache-to:
    description: Docker cache export configuration.
    default: ""
  registry-password:
    description: GitHub token with packages write permission.
    required: true
outputs:
  digest:
    description: Published immutable image digest.
    value: ${{ steps.image.outputs.digest }}
runs:
  using: composite
  steps:
    - name: 🐳 Set up QEMU
      if: inputs.qemu == 'true'
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
    - name: 🔐 Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.registry-password }}
    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
    - name: 📤 Build and push image
      id: image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        tags: ${{ inputs.tags }}
        platforms: ${{ inputs.platforms }}
        build-args: ${{ inputs.build-args }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}
        push: true
        provenance: true
        sbom: true
