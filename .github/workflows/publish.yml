name: Validate and publish

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: corepack enable
      - run: corepack yarn install --immutable
      - run: corepack yarn check
      - run: corepack yarn lint
      - run: corepack yarn test
      - run: corepack yarn format:check
      - run: corepack yarn test:pack

  publish:
    needs: validate
    if: >-
      github.repository == 'db21org/toolkit' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: npm-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - run: corepack enable
      - run: corepack yarn install --immutable
      - run: corepack yarn version:preview
      - run: corepack yarn build
      # Concurrency alone does not order queued GitHub runs. Never move dev back
      # to an older checkout when a newer main commit is already available.
      - name: Check current main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping superseded main commit.'
          fi
      - name: Publish dev preview with OIDC
        if: steps.head.outputs.current == 'true'
        run: npm publish --tag dev --access public
